spring:
  application:
    name: credito-score-api
  datasource:
    url: jdbc:h2:mem:credito;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

logging:
  level:
    com.brenoluna.creditoscore: INFO
